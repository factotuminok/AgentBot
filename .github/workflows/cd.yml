name: CD
# Deploys the version a successful CI run on main built and pushed (requirements OPS-05) to each configured target, and
# waits until the orchestrator's /readyz and web's /healthz report it. A target without its repository variable is
# skipped. README.md, "Continuous deployment", has the setup:
#   kubernetes  variable AGENTBOT_K8S_NAMESPACE, secret KUBECONFIG; optional variables AGENTBOT_K8S_RELEASE (default
#               agentbot) and AGENTBOT_K8S_VALUES (the release's Helm values as YAML).
#   podman      variable AGENTBOT_PODMAN_DIR (the deploy directory on the host); a self-hosted runner labelled
#               agentbot-podman, running as the stack's user on the Podman host.
# Rollback: re-run an earlier CD run (it deploys that run's version), or run the deploy script by hand.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
concurrency:
  group: cd
  cancel-in-progress: false # never interrupt a deploy; a newer run waits for it
permissions:
  contents: read
  packages: read
jobs:
  version:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: version
        name: Version of the CI run (same formula as ci.yml)
        env:
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          base=$(jq -r .version package.json)
          version="${base%.*}.${CI_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agentbot" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$version\` (CI run $CI_RUN_NUMBER, $HEAD_SHA)" >> "$GITHUB_STEP_SUMMARY"
  kubernetes:
    needs: version
    if: vars.AGENTBOT_K8S_NAMESPACE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
      NAMESPACE: ${{ vars.AGENTBOT_K8S_NAMESPACE }}
      RELEASE: ${{ vars.AGENTBOT_K8S_RELEASE || 'agentbot' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1 # same as ci.yml and .tools/helm
      - name: Kubeconfig and values
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          VALUES: ${{ vars.AGENTBOT_K8S_VALUES }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::error::AGENTBOT_K8S_NAMESPACE is set but the KUBECONFIG secret is missing"
            exit 1
          fi
          (umask 077 && printf '%s\n' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig")
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          printf '%s\n' "$VALUES" > "$RUNNER_TEMP/values.yaml"
      - run: deploy/k8s/deploy.sh "$VERSION" -f "$RUNNER_TEMP/values.yaml"
      - if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
  podman:
    needs: version
    if: vars.AGENTBOT_PODMAN_DIR != ''
    runs-on: [self-hosted, linux, agentbot-podman]
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
      AGENTBOT_DEPLOY_DIR: ${{ vars.AGENTBOT_PODMAN_DIR }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Log in to GHCR (as the stack's user; the Podman socket's pulls use the same credentials)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The runner service has no login session; rootless Podman keeps its runtime files here.
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          podman login ghcr.io -u "$GHCR_USER" --password-stdin <<< "$GHCR_TOKEN"
      - run: deploy/podman/deploy.sh "$VERSION"
      - if: always()
        run: podman logout ghcr.io || true
