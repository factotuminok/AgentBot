# Fake orchestrator for spike S5: serves /internal/scale on :8081 behind bearer auth.
# Scripts come from ConfigMap s5-scripts (kubectl create configmap s5-scripts --from-file=fake-scale.py --from-file=worker.py).
apiVersion: v1
kind: Namespace
metadata:
  name: agentbot-s5
---
apiVersion: v1
kind: Secret
metadata:
  name: agentbot-scale-token
  namespace: agentbot-s5
type: Opaque
stringData:
  token: s5-spike-scale-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: agentbot-s5
spec:
  replicas: 1
  selector:
    matchLabels: { app: orchestrator }
  template:
    metadata:
      labels: { app: orchestrator }
    spec:
      containers:
        - name: fake-scale
          image: docker.io/library/python:3.12-alpine
          command: ["python", "-u", "/scripts/fake-scale.py"]
          env:
            - name: SCALE_TOKEN
              valueFrom: { secretKeyRef: { name: agentbot-scale-token, key: token } }
          ports: [{ containerPort: 8081 }]
          volumeMounts: [{ name: scripts, mountPath: /scripts }]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
      volumes:
        - name: scripts
          configMap: { name: s5-scripts }
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: agentbot-s5
spec:
  selector: { app: orchestrator }
  ports: [{ name: internal, port: 8081, targetPort: 8081 }]
