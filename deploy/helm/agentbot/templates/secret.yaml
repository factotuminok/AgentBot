{{- if not .Values.secrets.existingSecret }}
{{- /* Generated on first install; every later render reads the live Secret back so the values never change. */}}
{{- $name := include "agentbot.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentbot.labels" (dict "root" .) | nindent 4 }}
  annotations:
    # Without the master key the settings vault stays locked; keep it with the state volume.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range list "master-key" "web-api-token" "worker-token" "scale-token" }}
  {{ . }}: {{ get $data . | default (randAlphaNum 64 | b64enc) }}
  {{- end }}
{{- end }}
